# =============================================================================
# Experiment 6 — timing pilot: 1 attack (relevant_start_5), n=5 examples,
# all 12+12 layers, all 3 conditions, encoder self-attn + decoder cross-attn.
# Measures wall-clock time per (layer, condition, example) cell so the full
# grid's n_examples/attack-count can be sized with real numbers instead of
# a guess. Run this BEFORE configs/default.yaml's full grid.
# =============================================================================

model:
  checkpoint: "castorini/monot5-base-msmarco"
  max_length: 512
  device: "auto"

attacks:
  inherit_from: "../../01_monot5_layer_patching/configs/multi_attack.yaml"
  max_attacks: null

regions:
  - encoder_self_attn
  - decoder_cross_attn

conditions:
  - doc_only
  - query_only
  - both

selection:
  reuse_dir: "../../01_monot5_layer_patching/outputs/attacks"
  min_attack_delta: 0.0

data:
  max_pairs: 500
  max_docs_per_query: 1000

runs:
  grid:
    n_examples: 5
  canonical:
    attack_name: "relevant_start_5"
    n_examples: 5

runtime:
  seed: 42
  batch_size_scoring: 8

outputs:
  base_dir: "../outputs_pilot"
