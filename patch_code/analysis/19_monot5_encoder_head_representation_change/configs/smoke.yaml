# Smoke: 4 evenly spaced attacks x 24 evenly spaced instances, CPU, every storage option on (to measure sizes).
# NOT for scientific use.
extends: "default.yaml"
model:
  device: "cpu"
run:
  batch_pairs: 8
  max_attacks: 4
  max_instances_per_attack: 24
  n_boot: 200
storage:
  per_instance_metrics: true
  pooled_vectors: true
outputs:
  base_dir: "../outputs_smoke"
