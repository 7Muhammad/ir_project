# =============================================================================
# Experiment 14 — SMOKE config. Tiny data, CPU-feasible, exercises every
# pipeline stage end-to-end (direction fitting, all 5 encoder position
# masks, scale selection, IID test, clean damage, all 3 attack-OOD
# protocols, aggregation, plots). Not for scientific use.
# =============================================================================

model:
  checkpoint: "castorini/monot5-base-msmarco"
  max_length: 512
  device: "auto"

# Small, deliberately diverse attack subset: 2 tokens x {start,end,random}
# x reps in {1,2,3,5} — enough distinct values per OOD factor (token: 2,
# position: 3, repetitions: 4) to exercise leave-one-value-out fold
# construction on all three factors without running the full 105-grid.
attacks:
  inherit_from: "../../01_monot5_layer_patching/configs/multi_attack.yaml"
  mode: "include"
  include:
    - relevant_start_1
    - relevant_end_2
    - relevant_random_3
    - true_start_2
    - true_end_5
    - true_random_1
  max_attacks: null

data:
  pairs_jsonl: "../../01_monot5_layer_patching/outputs/pairs/pairs.jsonl"
  exp1_attacks_dir: "../../01_monot5_layer_patching/outputs/attacks"

heads:
  exp13_heads_dir: "../../13_monot5_encoder_decoder_path_patching/configs/heads"
  # Smoke-only caps applied by downstream scripts (never by
  # 00_derive_candidate_heads.py, which always writes the full 18+31).
  max_encoder_heads: 1
  max_decoder_heads: 1

split:
  seed: 42
  ratios:
    train: 0.6
    validation: 0.2
    test: 0.2

sampling:
  max_train_examples_total: 12
  max_validation_examples_per_condition: 4
  max_test_examples_per_condition: 4
  max_clean_pairs_per_split: 4
  max_ood_examples_per_condition: 3

intervention:
  scales: [1.0, 1.5]
  reference_scale: 1.5

clean_damage:
  thresholds: [0.05, 0.1, 0.25, 0.5]

ood:
  factors: ["token", "position", "repetitions"]

runtime:
  seed: 42

outputs:
  base_dir: "../outputs_smoke"
